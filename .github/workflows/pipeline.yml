name: DevSystem CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devsystem-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar e testar container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar arquivos obrigatórios
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s nginx/default.conf

      - name: Construir imagem de teste
        run: docker build --tag devsystem:test .

      - name: Testar saúde do container
        run: |
          docker run --detach --name devsystem-smoke devsystem:test
          for attempt in 1 2 3 4 5; do
            if docker exec devsystem-smoke wget -q --spider http://127.0.0.1/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devsystem-smoke
          exit 1

      - name: Remover container de teste
        if: always()
        run: docker rm --force devsystem-smoke 2>/dev/null || true

  publish:
    name: Publicar imagem nos registries
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Definir nome da imagem
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=registry.devsystem.tech/devsystem/portfolio" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${owner}/devsystem-portfolio" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticar no Registry DevSystem
        uses: docker/login-action@v3
        with:
          registry: registry.devsystem.tech
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.ghcr }}:latest
            ${{ steps.image.outputs.ghcr }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    name: Implantar no servidor
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/devsystem' }}
      HTTP_PORT: ${{ vars.HTTP_PORT || '8080' }}
      IMAGE_NAME: registry.devsystem.tech/devsystem/portfolio:${{ github.sha }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar acesso SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Enviar arquivo do Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$SSH_PORT" deploy/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Autenticar servidor no Registry DevSystem
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login registry.devsystem.tech --username devsystem --password-stdin"

      - name: Atualizar aplicação
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && IMAGE_NAME='$IMAGE_NAME' HTTP_PORT='$HTTP_PORT' docker compose pull && IMAGE_NAME='$IMAGE_NAME' HTTP_PORT='$HTTP_PORT' docker compose up -d --remove-orphans && docker image prune -f"

      - name: Verificar aplicação
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "for attempt in 1 2 3 4 5 6; do wget -q --spider http://127.0.0.1:'$HTTP_PORT'/health && exit 0; sleep 5; done; docker compose -f '$DEPLOY_PATH/docker-compose.yml' logs --tail=100; exit 1"
