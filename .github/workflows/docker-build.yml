name: Build das imagens Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend
        run: docker build -t portfolio-frontend:ci ./frontend

      - name: Build backend
        run: docker build -t portfolio-backend:ci ./backend

