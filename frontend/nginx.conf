server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend estático
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para o backend — mesmo caminho /api funciona tanto no
    # Docker Compose local (serviço "backend") quanto atrás do Ingress no
    # Kubernetes (Service "backend"), sem o frontend precisar saber onde
    # a API realmente está.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Documentação automática da API (Swagger/FastAPI) — bônus para quem
    # for avaliar o projeto tecnicamente.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
