apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-db-pvc
  namespace: portfolio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-db-init
  namespace: portfolio
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS skills (
        id SERIAL PRIMARY KEY,
        categoria VARCHAR(50) NOT NULL,
        nome VARCHAR(80) NOT NULL,
        nivel INT NOT NULL CHECK (nivel BETWEEN 0 AND 100)
    );
    CREATE TABLE IF NOT EXISTS projetos (
        id SERIAL PRIMARY KEY,
        titulo VARCHAR(120) NOT NULL,
        descricao TEXT NOT NULL,
        tecnologias VARCHAR(200) NOT NULL,
        link VARCHAR(300)
    );
    CREATE TABLE IF NOT EXISTS guestbook (
        id SERIAL PRIMARY KEY,
        nome VARCHAR(80) NOT NULL,
        mensagem VARCHAR(500) NOT NULL,
        criado_em TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    INSERT INTO skills (categoria, nome, nivel) VALUES
        ('Suporte & Infra', 'Linux (administração de servidores)', 80),
        ('Containers', 'Docker', 80),
        ('Containers', 'Kubernetes', 65),
        ('Monitoramento', 'Zabbix', 80)
    ON CONFLICT DO NOTHING;
    INSERT INTO projetos (titulo, descricao, tecnologias, link) VALUES
        ('Este portfólio', 'Site pessoal construído como demonstração técnica de Docker e Kubernetes.', 'Docker, Kubernetes, FastAPI, PostgreSQL, Nginx', NULL)
    ON CONFLICT DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-db
  namespace: portfolio
  labels:
    app: portfolio-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portfolio-db
  template:
    metadata:
      labels:
        app: portfolio-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: portfolio-db-secret
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres   # evita erro do Postgres com pasta "lost+found" em alguns provisionadores
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "portfolio_user"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "portfolio_user"] }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: portfolio-db-pvc
        - name: db-init
          configMap:
            name: portfolio-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: portfolio
spec:
  type: ClusterIP
  selector:
    app: portfolio-db
  ports:
    - port: 5432
      targetPort: 5432
